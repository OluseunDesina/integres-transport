<div class="mx-auto max-w-2xl">
  <h1 class="text-lg font-semibold text-slate-900">Welcome, {{ authStore.user()?.email }}</h1>

  <dl class="mt-4 grid grid-cols-[max-content_1fr] gap-x-4 gap-y-2 text-sm">
    <dt class="text-slate-500">Client</dt>
    <dd>{{ authStore.user()?.client ?? '—' }}</dd>
    <dt class="text-slate-500">Platform staff</dt>
    <dd>{{ authStore.user()?.isPlatformStaff }}</dd>
  </dl>

  <div
    *appHasPermission="'client-admin:access'"
    class="mt-4 rounded-md border border-emerald-200 bg-emerald-50 p-3 text-sm text-emerald-700"
  >
    You have client-admin-app access.
  </div>
</div>
