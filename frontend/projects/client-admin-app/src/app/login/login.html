<app-auth-layout>
  <!-- The operator's mark, not ours, wherever the host resolves to a
       configured tenant. `super-admin-app` deliberately has none: it
       spans every Client, so there is no tenant whose brand it could
       wear. -->
  <div class="mb-6 flex justify-center">
    <app-brand-mark [height]="36" />
  </div>

  <h1 class="mb-1 text-xl font-semibold text-strong">Sign in</h1>
  <p class="mb-6 text-muted">{{ subtitle }}</p>

  @if (errorMessage(); as message) {
    <ui-alert class="mb-4">{{ message }}</ui-alert>
  }

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-4" novalidate>
    <ui-text-field
      label="Email"
      type="email"
      autocomplete="email"
      formControlName="email"
      [invalid]="!!fieldError('email')"
      [errorMessage]="fieldError('email')"
    />
    <ui-text-field
      label="Password"
      type="password"
      autocomplete="current-password"
      formControlName="password"
      [invalid]="!!fieldError('password')"
      [errorMessage]="fieldError('password')"
    />
    <ui-button type="submit" [loading]="submitting()" [disabled]="submitting()">
      Sign in
    </ui-button>
  </form>

  <p class="mt-6 text-muted">
    Don't have an account?
    <a routerLink="/register" class="font-medium text-strong underline focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus">Register</a>
  </p>
</app-auth-layout>
