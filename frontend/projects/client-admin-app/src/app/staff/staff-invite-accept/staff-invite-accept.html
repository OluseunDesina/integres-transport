<app-auth-layout>
  <!-- The operator's mark, or ours where the host resolves to no
       tenant — which is the normal case on this screen, since a
       self-registering Client does not exist yet. -->
  <div class="mb-6 flex justify-center">
    <app-brand-mark [height]="36" />
  </div>

  @if (loading()) {
    <p class="text-muted">Loading invitation…</p>
  } @else if (invalidMessage(); as message) {
    <h1 class="mb-1 text-xl font-semibold text-strong">Invitation unavailable</h1>
    <p class="text-muted">
      {{ message }}
      <a routerLink="/login" class="font-medium text-strong underline focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus">Back to sign in</a>
    </p>
  } @else {
    <h1 class="mb-1 text-xl font-semibold text-strong">Join {{ clientName() }}</h1>
    <p class="mb-6 text-muted">
      Set a password to join as {{ roleName() }}.
    </p>

    @if (errorMessage(); as message) {
      <ui-alert class="mb-4">{{ message }}</ui-alert>
    }

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-4" novalidate>
      <ui-text-field
        label="Password"
        type="password"
        autocomplete="new-password"
        formControlName="password"
        [invalid]="!!fieldError('password')"
        [errorMessage]="fieldError('password')"
      />
      <ui-text-field
        label="Confirm password"
        type="password"
        autocomplete="new-password"
        formControlName="confirmPassword"
        [invalid]="!!fieldError('confirmPassword')"
        [errorMessage]="fieldError('confirmPassword')"
      />
      <ui-button type="submit" [loading]="submitting()" [disabled]="submitting()">
        Create account
      </ui-button>
    </form>
  }
</app-auth-layout>
