<app-auth-layout>
  <!-- Mark plus "Validator": a conductor must be able to tell this app
       from the passenger one at a glance, and a tenant logo alone
       cannot say which it is. -->
  <div class="mb-6 flex flex-col items-center gap-1">
    <app-brand-mark [height]="36" />
    <span class="text-sm font-semibold tracking-wide text-muted uppercase">Validator</span>
  </div>

  <h1 class="mb-1 text-xl font-semibold text-strong">Sign in</h1>
  <p class="mb-6 text-muted">{{ subtitle }}</p>

  @if (errorMessage(); as message) {
    <ui-alert class="mb-4">{{ message }}</ui-alert>
  }

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-4" novalidate>
    <ui-text-field
      label="Email"
      type="email"
      autocomplete="email"
      formControlName="email"
      [invalid]="!!fieldError('email')"
      [errorMessage]="fieldError('email')"
    />
    <ui-text-field
      label="Password"
      type="password"
      autocomplete="current-password"
      formControlName="password"
      [invalid]="!!fieldError('password')"
      [errorMessage]="fieldError('password')"
    />
    <ui-button type="submit" [loading]="submitting()" [disabled]="submitting()">
      Sign in
    </ui-button>
  </form>
</app-auth-layout>
