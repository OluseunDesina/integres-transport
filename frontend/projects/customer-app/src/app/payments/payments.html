<div class="flex flex-col gap-6">
  <ui-page-header
    title="My payments"
    description="Every payment attempt for your bookings, including failed ones."
  />

  @if (store.error(); as message) {
    <ui-alert>{{ message }}</ui-alert>
  } @else if (store.isEmpty()) {
    <ui-empty-state
      title="No payments yet"
      description="Payments you make for a booking will appear here."
    />
  } @else {
    <ui-table label="My payments" [loading]="store.loading()">
      <thead>
        <tr class="border-b border-border text-xs uppercase tracking-wide text-muted">
          <th class="py-2">Created</th>
          <th class="hidden py-2 md:table-cell">Amount</th>
          <th class="py-2">Status</th>
        </tr>
      </thead>
      <tbody>
        @for (payment of store.items(); track payment.id) {
          <tr class="border-b border-border last:border-0 hover:bg-surface-muted">
            <td class="py-2 font-medium text-strong">
              {{ payment.created_at | date: 'short' }}
              <!-- The Amount column, hidden below `md`. -->
              <span class="mt-0.5 block text-sm font-normal text-muted md:hidden">
                {{ amountLabel(payment) }}
              </span>
            </td>
            <td class="hidden py-2 md:table-cell">{{ amountLabel(payment) }}</td>
            <td class="py-2">
              <ui-status-pill
                [tone]="statusTone[payment.status]"
                [label]="statusLabel[payment.status]"
              />
            </td>
          </tr>
        }
      </tbody>
    </ui-table>
    <ui-paginator [total]="store.total()" [page]="store.page()" (pageChange)="onPageChange($event)" />
  }
</div>
