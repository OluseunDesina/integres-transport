<div class="flex flex-col gap-8">
  <ui-page-header
    [title]="greeting()"
    description="Review submissions and configure the operators on the platform."
  />

  <ul class="grid gap-4 sm:grid-cols-2">
    @for (destination of destinations; track destination.path) {
      <li>
        <a
          [routerLink]="destination.path"
          class="flex h-full items-start gap-3 rounded-lg border border-border bg-surface p-4 hover:border-control focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus"
        >
          <span
            class="flex h-9 w-9 shrink-0 items-center justify-center rounded-md bg-primary-subtle text-primary"
          >
            <ui-icon [name]="destination.icon" [size]="20" />
          </span>
          <span class="min-w-0">
            <span class="block font-medium text-strong">{{ destination.label }}</span>
            <span class="block text-sm text-muted">{{ destination.description }}</span>
          </span>
        </a>
      </li>
    }
  </ul>
</div>
