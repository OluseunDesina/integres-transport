components:
  schemas:
    AccountTypeEnum:
      enum:
      - wallet
      - business_clearing
      - integra_commission
      - psp_suspense
      - refund_contra
      type: string
      description: |-
        * `wallet` - Wallet
        * `business_clearing` - Business clearing
        * `integra_commission` - Integra commission
        * `psp_suspense` - PSP suspense
        * `refund_contra` - Refund / concession contra
    ActivityEntry:
      type: object
      properties:
