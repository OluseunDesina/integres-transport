    FareMatrix:
      type: object
      description: |-
        GET response. `currency` comes from the Business that owns the
        route, deliberately read from this payload by the frontend rather
        than looked up elsewhere — a previous slice shipped a bug reading a
        `currency` field off `LedgerAccount`, which has none.
      properties:
        route:
          type: string
          format: uuid
        currency:
          type: string
        fare_pricing_mode:
          type: string
        trip_class:
          type: string
        stops:
          type: array
          items:
            $ref: '#/components/schemas/FareMatrixStop'
        cells:
          type: array
          items:
            $ref: '#/components/schemas/FareMatrixCell'
      required:
      - cells
      - currency
      - fare_pricing_mode
      - route
      - stops
      - trip_class
    FareMatrixCell:
      type: object
      description: |-
        One forward stop pair. `amount` is null where the segment has no
        currently-effective rule — an unpriced cell, which the grid renders
        as empty and booking rejects as `FareNotConfigured`.

        `fare_segment_rule` is echoed so a later save can tell that the tip
        it is superseding has moved since the grid was loaded.
      properties:
        from_stop:
          type: string
          format: uuid
        to_stop:
          type: string
          format: uuid
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
        fare_segment_rule:
          type: string
          format: uuid
          nullable: true
      required:
      - amount
      - fare_segment_rule
      - from_stop
      - to_stop
    FareMatrixCellWrite:
      type: object
      description: |-
        One submitted cell. A null `amount` means "stop selling this
        segment" and closes the rule with no successor.

        `min_value` is exclusive of zero deliberately: a genuinely free
        segment is a policy decision, not a `0.00` fare, which looks
        indistinguishable from a data-entry slip.
      properties:
        from_stop:
          type: string
          format: uuid
        to_stop:
          type: string
          format: uuid
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
      required:
      - amount
      - from_stop
      - to_stop
    FareMatrixSaveResult:
      type: object
      description: |-
        What a save actually did. `unchanged` is reported rather than
        hidden so the operator can see that submitting the whole grid did
        not churn every cell's version history.
      properties:
        created:
          type: integer
        superseded:
          type: integer
        closed:
          type: integer
        unchanged:
          type: integer
      required:
      - closed
      - created
      - superseded
      - unchanged
    FareMatrixStop:
