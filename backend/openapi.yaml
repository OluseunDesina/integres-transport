components:
  schemas:
    AccountTypeEnum:
      enum:
      - wallet
      - business_clearing
      - integra_commission
      - psp_suspense
      - refund_contra
      type: string
      description: |-
        * `wallet` - Wallet
        * `business_clearing` - Business clearing
        * `integra_commission` - Integra commission
        * `psp_suspense` - PSP suspense
        * `refund_contra` - Refund / concession contra
    Booking:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        business:
          type: string
          format: uuid
          readOnly: true
        trip:
          allOf:
          - $ref: '#/components/schemas/BookingTrip'
          readOnly: true
        passenger:
          type: string
          format: uuid
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/BookingStatusEnum'
          readOnly: true
        total_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        currency:
          type: string
          readOnly: true
        cancellation_reason:
          type: string
          readOnly: true
        seats:
          type: array
          items:
            $ref: '#/components/schemas/BookingSeatReservation'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - business
      - cancellation_reason
      - created_at
      - currency
      - id
      - passenger
      - seats
      - status
      - total_amount
      - trip
    BookingCancel:
      type: object
      description: |-
        POST /bookings/{id}/cancel/ body. Mirrors
        `apps.scheduling.serializers.TripStatusSerializer`'s
        illegal-transition-in-`validate()` shape, narrowed to `Booking`'s
        only legal cancel transition (`pending_payment` -> `cancelled`).
      properties:
        reason:
          type: string
          default: ''
    BookingCreate:
      type: object
      description: |-
        POST /bookings/ body — see the spec's §3 request-handling order.

        No `create()`: unlike e.g. `apps.fares.serializers.FareRuleCreateSerializer`,
        the view calls `apps.booking.services.create_booking` directly rather
        than `serializer.save()` — that service needs `request.user` and the
        `Idempotency-Key` header, neither of which is part of this body, the
        same reason `apps.scheduling.serializers.TripStatusSerializer` has no
        `create()`/`update()` either.
      properties:
        trip:
          type: string
          format: uuid
        seats:
          type: array
          items:
            $ref: '#/components/schemas/BookingSeatRequest'
      required:
      - seats
      - trip
    BookingModeDefaultEnum:
      enum:
      - reservation
      - tap_and_go
      type: string
      description: |-
        * `reservation` - Reservation
        * `tap_and_go` - Tap and go
    BookingModeEnum:
      enum:
      - reservation
      - tap_and_go
      type: string
      description: |-
        * `reservation` - Reservation
        * `tap_and_go` - Tap and go
    BookingSeatRequest:
      type: object
      properties:
        seat:
          type: string
          format: uuid
        from_stop:
          type: string
          format: uuid
        to_stop:
          type: string
          format: uuid
      required:
      - from_stop
      - seat
      - to_stop
    BookingSeatReservation:
      type: object
      description: |-
        Nested read-only shape for `BookingSerializer.seats` — queried
        separately (`SeatReservation.objects.filter(booking=...)`), never a
        reverse accessor: every FK in `apps.seating` uses `related_name="+"`
        (see that app's `models.py` docstring), so there is no
        `booking.seatreservation_set` to traverse.
      properties:
        id:
          type: string
          format: uuid
        seat:
          type: string
        from_stop:
          type: string
        to_stop:
          type: string
        status:
          type: string
        held_until:
          type: string
          format: date-time
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
      required:
      - amount
      - from_stop
      - held_until
      - id
      - seat
      - status
      - to_stop
    BookingStatusEnum:
      enum:
      - pending_payment
      - paid
      - cancelled
      - expired
      type: string
      description: |-
        * `pending_payment` - Pending payment
        * `paid` - Paid
        * `cancelled` - Cancelled
        * `expired` - Expired
    BookingTrip:
      type: object
      description: |-
        Schema-only shape for `BookingSerializer.get_trip` — see
        docs/specs/4-fares-seating-booking-frontend.md §3.4. Mirrors
        apps.scheduling.serializers.TripSerializer.get_route's own nested
        {id, name} convention.
      properties:
        id:
          type: string
          format: uuid
        route:
          $ref: '#/components/schemas/BookingTripRoute'
        scheduled_departure_at:
          type: string
          format: date-time
        service_date:
          type: string
          format: date
      required:
      - id
      - route
      - scheduled_departure_at
      - service_date
    BookingTripRoute:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
      required:
      - id
      - name
    Business:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        vertical:
          $ref: '#/components/schemas/VerticalEnum'
        name:
          type: string
          maxLength: 255
        currency:
          type: string
          maxLength: 8
        timezone:
          type: string
          maxLength: 64
        booking_mode_default:
          $ref: '#/components/schemas/BookingModeDefaultEnum'
        fare_pricing_mode:
          $ref: '#/components/schemas/FarePricingModeEnum'
        is_active:
          type: boolean
        kyb_status:
          allOf:
          - $ref: '#/components/schemas/KybStatusEnum'
          readOnly: true
        kyb_submitted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - booking_mode_default
      - created_at
      - currency
      - id
      - kyb_status
      - kyb_submitted_at
      - name
      - timezone
      - vertical
    BusinessKybQueue:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        client:
          type: string
          format: uuid
          readOnly: true
        client_name:
          type: string
          readOnly: true
        vertical:
          allOf:
          - $ref: '#/components/schemas/VerticalEnum'
          readOnly: true
        name:
          type: string
          readOnly: true
        kyb_status:
          allOf:
          - $ref: '#/components/schemas/KybStatusEnum'
          readOnly: true
        kyb_submitted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        documents:
          type: array
          items:
            $ref: '#/components/schemas/KybDocument'
          readOnly: true
      required:
      - client
      - client_name
      - documents
      - id
      - kyb_status
      - kyb_submitted_at
      - name
      - vertical
    BusinessSeatHold:
      type: object
      description: |-
        Request body and response shape for the super-admin-only PATCH —
        docs/adr/0004. A plain Serializer, not a ModelSerializer: this
        endpoint's writable surface is exactly one field, deliberately
        never exposed on BusinessSerializer itself (see
        Business.seat_hold_minutes's own docstring). `id` is read-only,
        included only so the response confirms which Business was updated —
        BusinessSerializer itself can't be reused for the response since it
        doesn't include seat_hold_minutes at all.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        seat_hold_minutes:
          type: integer
          minimum: 1
      required:
      - id
      - seat_hold_minutes
    BusinessSuperAdmin:
      type: object
      description: |-
        Read-only cross-client Business search for platform staff —
        Phase 5 frontend Slice C. Unlike `BusinessKybQueueSerializer`, not
        filtered to any `kyb_status` (that queue drops a Business the
        moment it's decided; this is the general "pick a Business" list
        platform staff need before configuring its Paystack payout account
        or triggering a settlement run, neither of which existed before).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        client:
          type: string
          format: uuid
          readOnly: true
        client_name:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
        vertical:
          allOf:
          - $ref: '#/components/schemas/VerticalEnum'
          readOnly: true
        currency:
          type: string
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        kyb_status:
          allOf:
          - $ref: '#/components/schemas/KybStatusEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - client
      - client_name
      - created_at
      - currency
      - id
      - is_active
      - kyb_status
      - name
      - vertical
    ChannelEnum:
