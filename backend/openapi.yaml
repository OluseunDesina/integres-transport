          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - business
      - created_at
      - id
      - name
    StopCreate:
      type: object
      description: |-
        POST-only shape — `business` is a genuine client choice here (a
        Client can run several Businesses), resolved manually against the
        live, tenant-scoped Business.objects manager at request time, never
        via a class-body PrimaryKeyRelatedField(queryset=...).
      properties:
        business:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 255
        address:
          type: string
          default: ''
          maxLength: 500
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
      required:
      - business
      - name
    SuperAdminTokenObtain:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    TapCredential:
      type: object
      description: GET /tap-credentials/mine/ shape — `token` never appears here.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        channel:
          allOf:
          - $ref: '#/components/schemas/ChannelEnum'
          readOnly: true
        label:
          type: string
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - channel
      - created_at
      - id
      - is_active
      - label
    TapCredentialIssue:
      type: object
      description: POST /tap-credentials/ body.
      properties:
        channel:
          $ref: '#/components/schemas/ChannelEnum'
        label:
          type: string
          default: ''
      required:
      - channel
    TapCredentialIssued:
      type: object
      description: |-
        Response shape for POST /tap-credentials/ only — the one place
        `token` is ever exposed. `token` isn't a model field (only
        `token_hash` is), so it's sourced from serializer context rather
        than the instance.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        token:
          type: string
          readOnly: true
        channel:
          allOf:
          - $ref: '#/components/schemas/ChannelEnum'
          readOnly: true
        label:
          type: string
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - channel
      - created_at
      - id
      - is_active
      - label
      - token
    TapEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        trip:
          type: string
          format: uuid
          readOnly: true
        tap_type:
          allOf:
          - $ref: '#/components/schemas/TapTypeEnum'
          readOnly: true
        stop:
          type: string
          format: uuid
          readOnly: true
        tapped_at:
          type: string
          format: date-time
          readOnly: true
        journey:
