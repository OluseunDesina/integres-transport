  /api/v1/bookings/:
    get:
      operationId: bookings_list
      description: |-
        GET is staff-only ops visibility (`booking.view`); POST is the
        passenger-facing booking-creation endpoint — `IsAuthenticated` only,
        no Role/Permission gate, since passengers have no Role
        (docs/adr/0003, and see `apps.fares.views.TripFareView`'s own note
        on this same distinction).
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
        description: Filter to a single status.
      - in: query
        name: trip
        schema:
          type: string
        description: Filter to a single Trip.
      tags:
      - bookings
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBookingList'
          description: ''
    post:
      operationId: bookings_create
      description: |-
        GET is staff-only ops visibility (`booking.view`); POST is the
        passenger-facing booking-creation endpoint — `IsAuthenticated` only,
        no Role/Permission gate, since passengers have no Role
        (docs/adr/0003, and see `apps.fares.views.TripFareView`'s own note
        on this same distinction).
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: Client-generated key. A retried request with the same key and
          body returns the original Booking rather than creating a second one.
        required: true
      tags:
      - bookings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BookingCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BookingCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          description: ''
  /api/v1/bookings/{booking_id}/tickets/:
    get:
      operationId: bookings_tickets_list
      description: |-
        GET /bookings/{booking_id}/tickets/ — the passenger's own
        Tickets for one Booking (normally one, N for a group booking).
        Ownership-mismatch returns 403, matching
        `apps.booking.views.BookingCancelView`'s own precedent; a real but
        not-yet-`paid` Booking returns 404 (no Tickets exist yet), matching
        `PaystackAccountConfigView`'s "distinct 404 for a real-but-not-yet-
        configured state" precedent.
      parameters:
      - in: path
        name: booking_id
        schema:
          type: string
          format: uuid
        required: true
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
      - bookings
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTicketList'
          description: ''
  /api/v1/bookings/{id}/cancel/:
    post:
      operationId: bookings_cancel_create
      description: |-
        POST /bookings/{id}/cancel/ — passenger, own booking only. No
        `booking.manage` codename exists for staff (§2 of the spec): staff
        can see Bookings (`booking.view`), not cancel them on a passenger's
        behalf, this phase.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - bookings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingCancel'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BookingCancel'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BookingCancel'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          description: ''
  /api/v1/bookings/{id}/pay-from-wallet/:
    post:
      operationId: bookings_pay_from_wallet_create
      description: |-
        POST /bookings/{id}/pay-from-wallet/ — Phase 7. Passenger, own
        booking only; no request body (the booking id in the path is the
        whole request). Mirrors `BookingCancelView`'s own
        404-not-found/403-not-yours split, since both operate on a specific
        passenger's own booking by id.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - bookings
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentIntent'
          description: ''
