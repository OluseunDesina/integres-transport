      required:
      - id
      - journey
      - stop
      - tap_type
      - tapped_at
      - trip
    TapRecord:
      type: object
      description: POST /trips/{trip_id}/taps/ body.
      properties:
        token:
          type: string
        tap_type:
          $ref: '#/components/schemas/TapTypeEnum'
        stop_id:
          type: string
          format: uuid
      required:
      - stop_id
      - tap_type
      - token
    TapTypeEnum:
      enum:
      - board
      - alight
      type: string
      description: |-
        * `board` - Board
        * `alight` - Alight
    TelemetryDevice:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        business:
          type: string
          format: uuid
          readOnly: true
        label:
          type: string
          readOnly: true
        vehicle:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        is_active:
          type: boolean
          readOnly: true
        last_seen_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - business
      - created_at
      - id
      - is_active
      - label
      - last_seen_at
      - vehicle
    TelemetryDeviceCreate:
      type: object
      description: |-
        POST /telemetry/devices/ body — request validation only. The view
        calls `issue_device()` itself and builds the response from
        `TelemetryDeviceIssuedSerializer`, the same split
        `apps.tapngo.views.TapCredentialIssueView` uses, because the
        response needs `token` from context, not from an instance this
        serializer's own `create()` would produce.
      properties:
        business:
          type: string
          format: uuid
        label:
          type: string
          maxLength: 100
        vehicle:
          type: string
          format: uuid
          nullable: true
      required:
      - business
      - label
    TelemetryDeviceIssued:
      type: object
      description: |-
        Response shape for POST /telemetry/devices/ only — the one place
        `token` is ever exposed. Not a model field (only `token_hash` is),
        so it's sourced from serializer context rather than the instance.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        token:
          type: string
          readOnly: true
        business:
          type: string
          format: uuid
          readOnly: true
        label:
          type: string
          readOnly: true
        vehicle:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        is_active:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - business
      - created_at
      - id
      - is_active
      - label
      - token
      - vehicle
    TelemetrySourceEnum:
      enum:
      - device
      - simulated
      type: string
      description: |-
        * `device` - Device
        * `simulated` - Simulated
    Ticket:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        signed_payload:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/TicketStatusEnum'
          readOnly: true
        issued_at:
          type: string
          format: date-time
          readOnly: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
        boarded_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        trip_class:
          type: string
          readOnly: true
      required:
      - boarded_at
      - expires_at
      - id
      - issued_at
      - signed_payload
      - status
      - trip_class
    TicketStatusEnum:
      enum:
      - issued
      - boarded
      - expired
      - revoked
      type: string
      description: |-
        * `issued` - Issued
        * `boarded` - Boarded
        * `expired` - Expired
        * `revoked` - Revoked
    TicketValidate:
      type: object
      description: |-
        POST /trips/{trip_id}/tickets/validate/ body — mirrors
        `apps.tapngo.serializers.TapRecordSerializer`'s minimal shape; no FK
        resolution needed here, since everything is resolved from the
        decoded payload (or the credential token) inside
        `apps.ticketing.services`.

        Exactly one of `payload` and `token` — the two fare media that can
        board the same Ticket (docs/specs/10-booking-modes.md). Both are
        optional in the schema and the pairing is enforced here, because
        DRF has no native "exactly one of" declaration and a required field
        per media would make each impossible to send without the other.
      properties:
        payload:
          type: string
        token:
          type: string
    TicketValidationResult:
      type: object
      description: |-
        Schema-only shape for a successful validation response — not
        backed by a model, same convention as `SigningKeysResponseSerializer`
        above.
      properties:
        status:
          type: string
        passenger_name:
          type: string
        seat_number:
          type: string
          nullable: true
        from_stop:
          type: string
        to_stop:
          type: string
        trip_departure_at:
          type: string
          format: date-time
        booking_status:
          $ref: '#/components/schemas/BookingStatusEnum'
      required:
      - booking_status
      - from_stop
      - passenger_name
      - seat_number
      - status
      - to_stop
      - trip_departure_at
    TokenObtainResponse:
      type: object
      description: |-
        Documents the actual response shape of the three token-obtain
        endpoints for drf-spectacular. `AudienceScopedTokenObtainSerializer`
        itself only describes the *request* fields (email/password/client),
        so without this, the generated OpenAPI schema — and the TS types
        generated from it — would incorrectly describe the response as an
        echo of the request instead of `{access, refresh}`.
      properties:
        access:
          type: string
        refresh:
          type: string
      required:
      - access
      - refresh
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    Trip:
      type: object
      description: |-
        Read-only shape — Trip has no plain field-level PATCH; writes go
        through TripAssignmentSerializer (vehicle/driver) or
        TripStatusSerializer (status) instead.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        schedule:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        route:
          allOf:
          - $ref: '#/components/schemas/TripRoute'
          readOnly: true
        business:
          type: string
          format: uuid
          readOnly: true
        service_date:
          type: string
          format: date
          readOnly: true
        scheduled_departure_at:
          type: string
          format: date-time
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/Status61dEnum'
          readOnly: true
        status_changed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        actual_departure_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        actual_arrival_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        vehicle:
          allOf:
          - $ref: '#/components/schemas/TripVehicle'
          nullable: true
          readOnly: true
        driver:
          allOf:
          - $ref: '#/components/schemas/TripDriver'
          nullable: true
          readOnly: true
        booking_mode:
          allOf:
          - $ref: '#/components/schemas/BookingModeEnum'
          readOnly: true
        fare_collection_mode:
          allOf:
          - $ref: '#/components/schemas/ManifestKindEnum'
          readOnly: true
        trip_class:
          allOf:
          - $ref: '#/components/schemas/TripClassEnum'
          readOnly: true
        cancellation_reason:
          type: string
          readOnly: true
        compliance_warnings:
          type: array
          items:
            type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - actual_arrival_at
      - actual_departure_at
      - booking_mode
      - business
      - cancellation_reason
      - compliance_warnings
      - created_at
      - driver
      - fare_collection_mode
      - id
      - route
      - schedule
      - scheduled_departure_at
      - service_date
      - status
      - status_changed_at
      - trip_class
      - vehicle
    TripBookability:
      type: object
      description: |-
        The `GET /trips/{id}/availability/` envelope —
        docs/specs/10-booking-modes.md.

        Replaced a bare array of seat rows. The array could not distinguish
        "no vehicle assigned yet" from "every seat taken" — both were `[]` —
        so the customer app rendered a departure nobody had assigned a bus
        to as "sold out". `status` is the field that separates them.

        `seats` is always `[]` for open seating, and `capacity_remaining` is
        always `null` for reservation mode; each mode fills the half that
        means something for it rather than the API returning two shapes.
      properties:
        booking_mode:
          type: string
        trip_class:
          type: string
        status:
          type: string
        seats:
          type: array
          items:
            $ref: '#/components/schemas/SeatAvailability'
        capacity_remaining:
          type: integer
          nullable: true
        seat_selection_enabled:
          type: boolean
      required:
      - booking_mode
      - capacity_remaining
      - seat_selection_enabled
      - seats
      - status
      - trip_class
    TripCapacity:
      type: object
      properties:
        total_seats:
          type: integer
          nullable: true
        seats_sold:
          type: integer
        occupancy_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,3})?$
          nullable: true
      required:
      - occupancy_rate
      - seats_sold
      - total_seats
    TripClass:
      type: object
      description: |-
        POST /trips/{id}/class/ body — docs/specs/15-trip-classes.md.

        Its own endpoint rather than a field on the assignment PATCH: that
        body's `vehicle` and `driver` both default to None and therefore
        *clear* on omission, so a class edit that forgot to resend the
        vehicle would silently unassign it. Mirrors TripStatusSerializer's
        shape, which is the other guarded single-field Trip mutation.
      properties:
        trip_class:
          $ref: '#/components/schemas/TripClassEnum'
      required:
      - trip_class
    TripClassEnum:
      enum:
      - premium
      - exclusive
      - standard
      - mini
      type: string
      description: |-
        * `premium` - Premium
        * `exclusive` - Exclusive
        * `standard` - Standard
        * `mini` - Mini
    TripClassRevenue:
      type: object
      properties:
        trip_class:
          type: string
        currency:
          type: string
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        transaction_volume:
          type: integer
      required:
      - amount
      - currency
      - transaction_volume
      - trip_class
    TripCounts:
      type: object
      properties:
        scheduled:
          type: integer
        in_progress:
          type: integer
        completed:
          type: integer
        cancelled:
          type: integer
        completed_today:
          type: integer
      required:
      - cancelled
      - completed
      - completed_today
      - in_progress
      - scheduled
    TripCreate:
      type: object
      description: |-
        Manual (one-off) Trip creation. `schedule` is never accepted here
        — create_manual_trip() always sets schedule=None server-side.
      properties:
        route:
          type: string
          format: uuid
        service_date:
          type: string
          format: date
        departure_time:
          type: string
          format: time
        vehicle:
          type: string
          format: uuid
          nullable: true
        driver:
          type: string
          format: uuid
          nullable: true
        trip_class:
          $ref: '#/components/schemas/TripClassEnum'
      required:
      - departure_time
      - route
      - service_date
    TripDriver:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
      required:
      - id
      - name
    TripFareQuote:
      type: object
      properties:
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        currency:
          type: string
      required:
      - amount
      - currency
    TripLiveEnvelope:
      type: object
      description: |-
        One `GET /trips/live/` row, and the whole body of
        `GET /trips/{id}/live/`. `position`/`progress`/`eta` are `None`
        together whenever the trip has no telemetry at all — see
        `apps.telemetry.live.trip_live_envelope`.
      properties:
        trip:
          $ref: '#/components/schemas/LiveTrip'
        position:
          allOf:
          - $ref: '#/components/schemas/LivePosition'
          nullable: true
        progress:
          allOf:
          - $ref: '#/components/schemas/LiveProgress'
          nullable: true
        eta:
          allOf:
          - $ref: '#/components/schemas/LiveEta'
          nullable: true
        punctuality:
          $ref: '#/components/schemas/LivePunctuality'
        occupancy:
          $ref: '#/components/schemas/LiveOccupancy'
        incidents_open:
          type: integer
      required:
      - eta
      - incidents_open
      - occupancy
      - position
      - progress
      - punctuality
      - trip
    TripManifest:
      type: object
      description: |-
        The envelope.

        `kind` is what makes this readable: a pay-as-you-go trip sells no
        bookings and issues no tickets, so an empty `results` on one would
        say "nobody is aboard" when the bus is full. `results` is typed as
        the prepaid row here because a schema needs one shape; the PAYG
        branch is documented on the endpoint and carries
        `ManifestJourneyRowSerializer` rows.
      properties:
        trip:
          $ref: '#/components/schemas/ManifestTrip'
        kind:
          $ref: '#/components/schemas/ManifestKindEnum'
        totals:
          $ref: '#/components/schemas/ManifestTotals'
        count:
          type: integer
        next:
          type: string
          nullable: true
        previous:
          type: string
          nullable: true
        results:
          type: array
          items:
            $ref: '#/components/schemas/ManifestRow'
          readOnly: true
      required:
      - count
      - kind
      - next
      - previous
      - results
      - totals
      - trip
    TripMoney:
      type: object
      properties:
        currency:
          type: string
        revenue:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        gross:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        revenue_per_seat:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          nullable: true
      required:
      - currency
      - gross
      - revenue
      - revenue_per_seat
    TripPerformance:
      type: object
      properties:
        trip:
          $ref: '#/components/schemas/TripPerformanceTrip'
        capacity:
          $ref: '#/components/schemas/TripCapacity'
        punctuality:
          allOf:
          - $ref: '#/components/schemas/TripPunctuality'
          nullable: true
        money:
          type: array
          items:
            $ref: '#/components/schemas/TripMoney'
        incidents:
          type: integer
        cancelled:
          type: boolean
      required:
      - cancelled
      - capacity
      - incidents
      - money
      - punctuality
      - trip
    TripPerformanceTrip:
      type: object
      properties:
        id:
          type: string
          format: uuid
        route:
          type: string
        trip_class:
          type: string
        status:
          type: string
        booking_mode:
          type: string
        service_date:
          type: string
          format: date
      required:
      - booking_mode
      - id
      - route
      - service_date
      - status
      - trip_class
    TripPunctuality:
      type: object
      description: |-
        Null in full before the trip departs — a trip that has not left
        is not "0 minutes late". Measured at departure only: no scheduled
        arrival time exists anywhere in the model, which this spec names as
        a gap rather than inventing one.
      properties:
        scheduled_departure_at:
          type: string
          format: date-time
        actual_departure_at:
          type: string
          format: date-time
        actual_arrival_at:
          type: string
          format: date-time
          nullable: true
        delay_minutes:
          type: integer
        on_time:
          type: boolean
      required:
      - actual_arrival_at
      - actual_departure_at
      - delay_minutes
      - on_time
      - scheduled_departure_at
    TripRoute:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
      required:
      - id
      - name
    TripStatus:
      type: object
      description: |-
        POST /trips/{id}/status/ body. Mirrors
        apps.businesses.serializers.KybDecisionSerializer's
        reject-needs-a-reason shape, adapted to "cancelled needs a reason".
        Transition legality (TRIP_TRANSITIONS) is checked here, against
        `self.context["trip"]`'s current status — same context-passing
        convention as apps.network.serializers.RouteStopsUpdateSerializer.
      properties:
        status:
          $ref: '#/components/schemas/Status61dEnum'
        reason:
          type: string
          default: ''
      required:
      - status
    TripVehicle:
      type: object
      properties:
        id:
          type: string
          format: uuid
        registration_number:
          type: string
      required:
      - id
      - registration_number
    TripsLiveResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/TripLiveEnvelope'
        poll_interval_seconds:
          type: integer
        server_time:
          type: string
          format: date-time
      required:
      - poll_interval_seconds
      - results
      - server_time
    TypeEnum:
      enum:
      - wallet_topup
      - booking_paid
      - ticket_boarded
      - fare_deducted
      type: string
      description: |-
        * `wallet_topup` - wallet_topup
        * `booking_paid` - booking_paid
        * `ticket_boarded` - ticket_boarded
        * `fare_deducted` - fare_deducted
    Vehicle:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        business:
          type: string
          format: uuid
          readOnly: true
        vehicle_type:
          type: string
          format: uuid
          readOnly: true
        registration_number:
          type: string
          maxLength: 32
        insurance_expires_at:
          type: string
          format: date
          nullable: true
        roadworthiness_expires_at:
          type: string
          format: date
          nullable: true
        is_active:
          type: boolean
        compliance_warnings:
          type: array
          items:
            type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - business
      - compliance_warnings
      - created_at
      - id
      - registration_number
      - vehicle_type
    VehicleCreate:
      type: object
      properties:
        business:
          type: string
          format: uuid
        vehicle_type:
          type: string
          format: uuid
        registration_number:
          type: string
          maxLength: 32
        insurance_expires_at:
          type: string
          format: date
          nullable: true
        roadworthiness_expires_at:
          type: string
          format: date
          nullable: true
      required:
      - business
      - registration_number
      - vehicle_type
    VehicleType:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        business:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 100
        capacity:
          type: integer
          maximum: 2147483647
          minimum: 0
        trip_class:
          $ref: '#/components/schemas/TripClassEnum'
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - business
      - capacity
      - created_at
      - id
      - name
    VehicleTypeCreate:
      type: object
      properties:
        business:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 100
        capacity:
          type: integer
          minimum: 1
        trip_class:
          $ref: '#/components/schemas/TripClassEnum'
      required:
      - business
      - capacity
      - name
    VehicleTypeSeatsGenerate:
      type: object
      description: |-
        Body for POST /vehicle-types/{id}/seats/generate/ —
        docs/specs/8-seat-map-generation.md. `vehicle_type` is passed in
        via context, same as VehicleTypeSeatsUpdateSerializer above.
      properties:
        rows:
          type: integer
          minimum: 1
        columns:
          type: integer
          minimum: 1
        aisle_after_column:
          type: integer
          minimum: 1
          nullable: true
        numbering_scheme:
          allOf:
          - $ref: '#/components/schemas/NumberingSchemeEnum'
          default: row_letter
      required:
      - columns
      - rows
    VehicleTypeSeatsUpdate:
      type: object
      description: |-
        Body: {"seats": [{"seat_number": "1A", "row": 1, "column": 1}, ...]}
        — mirrors apps.network.serializers.RouteStopsUpdateSerializer's
        replace-the-set shape. `vehicle_type` (already resolved by the
        view from the URL) is passed in via context, not a field.
      properties:
        seats:
          type: array
          items:
            $ref: '#/components/schemas/SeatSpec'
      required:
      - seats
    VerticalEnum:
      enum:
      - shuttle
      - intercity
      - metro
      type: string
      description: |-
        * `shuttle` - Shuttle
        * `intercity` - Intercity
        * `metro` - Metro
    Wallet:
      type: object
      properties:
        balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        currency:
          type: string
        transactions:
          type: array
          items:
            $ref: '#/components/schemas/WalletTransaction'
      required:
      - balance
      - currency
      - transactions
    WalletTopupInitiate:
      type: object
      description: |-
        Nested shape for `PaymentInitiateSerializer.wallet_topup` — Phase
        7. `business_id` names the wallet being funded (there's no Booking
        to denormalize it from, unlike the booking-payment shape below).
      properties:
        business_id:
          type: string
          format: uuid
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
      required:
      - amount
      - business_id
    WalletTransaction:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        currency:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount
      - created_at
      - currency
      - id
    WhiteLabelConfig:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        domain:
          type: string
          maxLength: 255
        logo:
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        primary_color:
          type: string
          maxLength: 32
        secondary_color:
          type: string
          maxLength: 32
        email_sender_name:
          type: string
          maxLength: 255
        email_sender_address:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        terms_url:
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
      required:
      - domain
      - id
    WhiteLabelResolve:
      type: object
      properties:
        client_id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        logo:
          type: string
          format: uri
          readOnly: true
        primary_color:
          type: string
          readOnly: true
        secondary_color:
          type: string
          readOnly: true
        email_sender_name:
          type: string
          readOnly: true
        terms_url:
          type: string
          format: uri
          readOnly: true
      required:
      - client_id
      - email_sender_name
      - logo
      - name
      - primary_color
      - secondary_color
      - terms_url
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
