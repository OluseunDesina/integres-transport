    PatchedFareRuleSupersede:
      type: object
      description: |-
        PATCH body — closes the path's rule and returns a new successor.
        `effective_from` omitted means "now"; a future value schedules the
        change without affecting today's quote.
      properties:
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        effective_from:
          type: string
          format: date-time
