openapi: 3.0.3
info:
  title: Integra AFC API
  version: 1.0.0
  description: Automated Fare Collection platform API. Versioned from v1; see docs/adr/
    for tenancy, auth and domain-model decisions.
paths:
  /api/v1/auth/client-admin/token/:
    post:
      operationId: auth_client_admin_token_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientAdminTokenObtain'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ClientAdminTokenObtain'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ClientAdminTokenObtain'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainResponse'
          description: ''
  /api/v1/auth/customer/token/:
