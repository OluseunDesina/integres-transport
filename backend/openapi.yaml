    Passenger:
      type: object
      description: |-
        What a counter agent is allowed to see about a passenger they
        just resolved: enough to confirm the right person and to book for
        them, and no more.

        `email` is masked (`apps.identity.services.mask_email`) — the agent
        typed the address to get here, so this withholds nothing they did
        not already have, while keeping a full address off a screen a queue
        of other passengers can read.
      properties:
        id:
          type: string
          format: uuid
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          description: Masked — e.g. `a••••••@example.com`.
      required:
      - email
      - first_name
      - id
      - last_name
    PassengerIncident:
      type: object
      description: |-
        `GET /incidents/mine/`.

        A **separate class**, not a field-exclusion list on the shared one.
        An exclusion list is one careless edit away from leaking staff
        discussion of a safety report to the passenger who filed it; a
        separate class can only leak a field someone deliberately adds.
        `assigned_to`, `resolution_notes` and the trail are all absent, and
        a test asserts their absence by key rather than by shape.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        reference:
          type: string
          readOnly: true
        title:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
        category:
          allOf:
          - $ref: '#/components/schemas/CategoryEnum'
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/IncidentStatusEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        resolved_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - category
      - created_at
      - description
      - id
      - reference
      - resolved_at
      - status
      - title
    PatchedBusiness:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        vertical:
          $ref: '#/components/schemas/VerticalEnum'
        name:
          type: string
          maxLength: 255
        currency:
          $ref: '#/components/schemas/CurrencyEnum'
        timezone:
          type: string
          maxLength: 64
        booking_mode_default:
          $ref: '#/components/schemas/BookingModeDefaultEnum'
        fare_collection_mode:
          $ref: '#/components/schemas/ManifestKindEnum'
        seat_selection_enabled:
          type: boolean
        capacity_enforced:
          type: boolean
        fare_pricing_mode:
          $ref: '#/components/schemas/FarePricingModeEnum'
        is_active:
          type: boolean
        kyb_status:
          allOf:
          - $ref: '#/components/schemas/KybStatusEnum'
          readOnly: true
        kyb_submitted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
    PatchedBusinessSeatHold:
      type: object
      description: |-
        Request body and response shape for the super-admin-only PATCH —
        docs/adr/0004. A plain Serializer, not a ModelSerializer: this
        endpoint's writable surface is exactly one field, deliberately
        never exposed on BusinessSerializer itself (see
        Business.seat_hold_minutes's own docstring). `id` is read-only,
        included only so the response confirms which Business was updated —
        BusinessSerializer itself can't be reused for the response since it
        doesn't include seat_hold_minutes at all.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        seat_hold_minutes:
          type: integer
          minimum: 1
    PatchedDirector:
      type: object
      description: |-
        docs/specs/11-kyb-directors.md. `business` is read-only — it comes
        from the URL (`/businesses/{business_id}/directors/`), never the
        body, so a director cannot be created against a Business the caller
        didn't address.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        business:
          type: string
          format: uuid
          readOnly: true
        full_name:
