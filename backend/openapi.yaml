openapi: 3.0.3
info:
  title: Integra AFC API
  version: 1.0.0
  description: Automated Fare Collection platform API. Versioned from v1; see docs/adr/
    for tenancy, auth and domain-model decisions.
paths:
  /api/v1/activity/mine/:
    get:
      operationId: activity_mine_retrieve
      description: |-
        GET /activity/mine/ — the signed-in passenger's own recent
        activity: wallet top-ups, booking payments, tickets boarded and
        pay-as-you-go fares, newest first.

        `IsAuthenticated` only, matching every other "mine" passenger
        endpoint (`GET /wallet/mine/`, `GET /activity/mine/`'s own sibling)
        — passengers hold no Role/Permission to gate on (docs/adr/0003).
        Polled on the same `poll_interval_seconds`-in-the-response
        discipline as `GET /trips/live/`, at its own, wider interval:
        a passenger's history changes far less often than a vehicle's
        position, so there is no `ETag`/`?since=` machinery here — the
        fleet-bandwidth motivation for that in spec 20 slice 2 does not
        apply to one passenger's own small, bounded feed.
      tags:
      - activity
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityResponse'
          description: ''
  /api/v1/analytics/dashboard/:
    get:
      operationId: analytics_dashboard_retrieve
      description: |-
        GET /analytics/dashboard/ — the whole dashboard in one request.

        One envelope rather than a dozen endpoints the client fans out to
        and reduces locally: that pattern is the source of four separate
        production bugs recorded in CLAUDE.md, and on a dashboard it would
        produce silently wrong totals plausible enough that nobody checks.
      parameters:
      - in: query
        name: booking_status
        schema:
          type: string
        description: Booking status. Separate from `status`, which is a PaymentIntent
          status — one field validated against two enums cannot validate either.
      - in: query
        name: business
        schema:
          type: string
        description: Scope to one Business.
      - in: query
        name: channel
        schema:
          type: string
        description: Payment channel. `wallet` and `unknown` are accepted alongside
          the values Paystack reports.
      - in: query
        name: date_from
        schema:
          type: string
        description: Inclusive start, as a local date in the resolved timezone. Defaults
          to 29 days before date_to.
      - in: query
        name: date_to
        schema:
          type: string
        description: Inclusive end, as a local date. Defaults to today.
      - in: query
        name: granularity
        schema:
          type: string
          enum:
          - day
          - month
          - week
        description: Trend bucket size. Each has its own range cap; a longer range
          is a 400 naming the coarser granularity that would answer it.
      - in: query
        name: route
        schema:
          type: string
        description: Scope to one Route.
      - in: query
        name: status
        schema:
          type: string
        description: PaymentIntent status.
      - in: query
        name: trip_class
        schema:
          type: string
        description: Scope to one class.
      tags:
      - analytics
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
          description: ''
  /api/v1/analytics/payments/summary/:
    get:
      operationId: analytics_payments_summary_retrieve
      description: |-
        GET /analytics/payments/summary/ — the metrics strip above the
        transactions table.

        Gated on `payments.view`, not `analytics.view`: it describes exactly
        the rows `GET /payments/` returns for the same filters, so anyone
        who may read that table may read its totals. It takes the identical
        filter set through the identical shared module, which is what makes
        the strip and the table incapable of disagreeing.
      parameters:
      - in: query
        name: booking_status
        schema:
          type: string
        description: Booking status. Separate from `status`, which is a PaymentIntent
          status — one field validated against two enums cannot validate either.
      - in: query
        name: business
        schema:
          type: string
        description: Scope to one Business.
      - in: query
        name: channel
        schema:
          type: string
        description: Payment channel. `wallet` and `unknown` are accepted alongside
          the values Paystack reports.
      - in: query
        name: date_from
        schema:
          type: string
        description: Inclusive start, as a local date in the resolved timezone. Defaults
          to 29 days before date_to.
      - in: query
        name: date_to
        schema:
          type: string
        description: Inclusive end, as a local date. Defaults to today.
      - in: query
        name: granularity
        schema:
          type: string
          enum:
          - day
          - month
          - week
        description: Trend bucket size. Each has its own range cap; a longer range
          is a 400 naming the coarser granularity that would answer it.
      - in: query
        name: route
        schema:
          type: string
        description: Scope to one Route.
      - in: query
        name: status
        schema:
          type: string
        description: PaymentIntent status.
      - in: query
        name: trip_class
        schema:
          type: string
        description: Scope to one class.
      tags:
      - analytics
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentSummary'
          description: ''
  /api/v1/analytics/revenue/:
