      required:
      - password
    StaffInvitationCreate:
      type: object
      properties:
        email:
          type: string
          format: email
        role:
          type: string
          format: uuid
      required:
      - email
      - role
    StaffInvitationCreatedResponse:
      type: object
      description: |-
        Same shape as apps.clients.serializers.InvitationCreatedResponseSerializer
        for the identical "invite and return {id}" response — duplicated
        rather than cross-imported, matching how KYC/KYB's near-identical
        per-app serializers are already handled.
      properties:
        id:
          type: string
          format: uuid
      required:
      - id
    StaffInvitationResolve:
      type: object
      properties:
        client_name:
          type: string
          readOnly: true
        role_name:
          type: string
          readOnly: true
        status:
          type: string
          readOnly: true
      required:
      - client_name
      - role_name
      - status
    Status448Enum:
      enum:
      - pending
      - succeeded
      - failed
      - cancelled
      type: string
      description: |-
        * `pending` - Pending
        * `succeeded` - Succeeded
        * `failed` - Failed
        * `cancelled` - Cancelled
    Status44bEnum:
      enum:
      - open
      - closed
      - needs_review
      type: string
      description: |-
        * `open` - Open
        * `closed` - Closed
        * `needs_review` - Needs review
    Status61dEnum:
      enum:
      - scheduled
      - in_progress
      - completed
      - cancelled
      type: string
      description: |-
        * `scheduled` - Scheduled
        * `in_progress` - In progress
        * `completed` - Completed
        * `cancelled` - Cancelled
    StatusE94Enum:
      enum:
      - pending
      - approved
      - rejected
      type: string
      description: |-
        * `pending` - Pending
        * `approved` - Approved
        * `rejected` - Rejected
    Stop:
      type: object
      description: |-
        Read + PATCH shape. `business` is read_only here — never
        writable after creation, and DRF never runs validation against
        read_only relational fields, so no queryset-at-import-time trap.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        business:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 255
        address:
          type: string
          maxLength: 500
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - business
      - created_at
      - id
      - name
    StopCreate:
      type: object
      description: |-
        POST-only shape — `business` is a genuine client choice here (a
        Client can run several Businesses), resolved manually against the
        live, tenant-scoped Business.objects manager at request time, never
        via a class-body PrimaryKeyRelatedField(queryset=...).
      properties:
        business:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 255
        address:
          type: string
          default: ''
          maxLength: 500
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
      required:
      - business
      - name
    SuperAdminTokenObtain:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    TapCredential:
      type: object
      description: GET /tap-credentials/mine/ shape — `token` never appears here.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        channel:
          allOf:
          - $ref: '#/components/schemas/ChannelEnum'
          readOnly: true
        label:
          type: string
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - channel
      - created_at
      - id
      - is_active
      - label
    TapCredentialIssue:
      type: object
      description: POST /tap-credentials/ body.
      properties:
        channel:
          $ref: '#/components/schemas/ChannelEnum'
        label:
          type: string
          default: ''
      required:
      - channel
    TapCredentialIssued:
      type: object
      description: |-
        Response shape for POST /tap-credentials/ only — the one place
        `token` is ever exposed. `token` isn't a model field (only
        `token_hash` is), so it's sourced from serializer context rather
        than the instance.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        token:
          type: string
          readOnly: true
        channel:
          allOf:
          - $ref: '#/components/schemas/ChannelEnum'
          readOnly: true
        label:
          type: string
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - channel
      - created_at
      - id
      - is_active
      - label
      - token
    TapEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        trip:
          type: string
          format: uuid
          readOnly: true
        tap_type:
          allOf:
          - $ref: '#/components/schemas/TapTypeEnum'
          readOnly: true
        stop:
          type: string
          format: uuid
          readOnly: true
        tapped_at:
          type: string
          format: date-time
          readOnly: true
        journey:
          $ref: '#/components/schemas/FareJourneyNested'
      required:
      - id
      - journey
      - stop
      - tap_type
      - tapped_at
      - trip
    TapRecord:
      type: object
      description: POST /trips/{trip_id}/taps/ body.
      properties:
        token:
          type: string
        tap_type:
          $ref: '#/components/schemas/TapTypeEnum'
        stop_id:
          type: string
          format: uuid
      required:
      - stop_id
      - tap_type
      - token
    TapTypeEnum:
      enum:
      - board
      - alight
      type: string
      description: |-
        * `board` - Board
        * `alight` - Alight
    Ticket:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        signed_payload:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/TicketStatusEnum'
          readOnly: true
        issued_at:
          type: string
          format: date-time
          readOnly: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
        boarded_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - boarded_at
      - expires_at
      - id
      - issued_at
      - signed_payload
      - status
    TicketStatusEnum:
      enum:
      - issued
      - boarded
      - expired
      - revoked
      type: string
      description: |-
        * `issued` - Issued
        * `boarded` - Boarded
        * `expired` - Expired
        * `revoked` - Revoked
    TicketValidate:
      type: object
      description: |-
        POST /trips/{trip_id}/tickets/validate/ body — mirrors
        `apps.tapngo.serializers.TapRecordSerializer`'s minimal shape; no FK
        resolution needed here, since everything is resolved from the
        decoded payload inside `apps.ticketing.services.validate_ticket`.
      properties:
        payload:
          type: string
      required:
      - payload
    TicketValidationResult:
      type: object
      description: |-
        Schema-only shape for a successful validation response — not
        backed by a model, same convention as `SigningKeysResponseSerializer`
        above.
      properties:
        status:
          type: string
        passenger_name:
          type: string
        seat_number:
          type: string
        from_stop:
          type: string
        to_stop:
          type: string
        trip_departure_at:
          type: string
          format: date-time
      required:
      - from_stop
      - passenger_name
      - seat_number
      - status
      - to_stop
      - trip_departure_at
    TokenObtainResponse:
      type: object
      description: |-
        Documents the actual response shape of the three token-obtain
        endpoints for drf-spectacular. `AudienceScopedTokenObtainSerializer`
        itself only describes the *request* fields (email/password/client),
        so without this, the generated OpenAPI schema — and the TS types
        generated from it — would incorrectly describe the response as an
        echo of the request instead of `{access, refresh}`.
      properties:
        access:
          type: string
        refresh:
          type: string
      required:
      - access
      - refresh
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    Trip:
      type: object
      description: |-
        Read-only shape — Trip has no plain field-level PATCH; writes go
        through TripAssignmentSerializer (vehicle/driver) or
        TripStatusSerializer (status) instead.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        schedule:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        route:
          allOf:
          - $ref: '#/components/schemas/TripRoute'
          readOnly: true
        business:
          type: string
          format: uuid
          readOnly: true
        service_date:
          type: string
          format: date
          readOnly: true
        scheduled_departure_at:
          type: string
          format: date-time
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/Status61dEnum'
          readOnly: true
        status_changed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        vehicle:
          allOf:
          - $ref: '#/components/schemas/TripVehicle'
          nullable: true
          readOnly: true
        driver:
          allOf:
          - $ref: '#/components/schemas/TripDriver'
          nullable: true
          readOnly: true
        booking_mode:
          allOf:
          - $ref: '#/components/schemas/BookingModeEnum'
          readOnly: true
        cancellation_reason:
          type: string
          readOnly: true
        compliance_warnings:
          type: array
          items:
            type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - booking_mode
      - business
      - cancellation_reason
      - compliance_warnings
      - created_at
      - driver
      - id
      - route
      - schedule
      - scheduled_departure_at
      - service_date
      - status
      - status_changed_at
      - vehicle
    TripCreate:
      type: object
      description: |-
        Manual (one-off) Trip creation. `schedule` is never accepted here
        — create_manual_trip() always sets schedule=None server-side.
      properties:
        route:
          type: string
          format: uuid
        service_date:
          type: string
          format: date
        departure_time:
          type: string
          format: time
        vehicle:
          type: string
          format: uuid
          nullable: true
        driver:
          type: string
          format: uuid
          nullable: true
      required:
      - departure_time
      - route
      - service_date
    TripDriver:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
      required:
      - id
      - name
    TripFareQuote:
      type: object
      properties:
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        currency:
          type: string
      required:
      - amount
      - currency
    TripRoute:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
      required:
      - id
      - name
    TripStatus:
      type: object
      description: |-
        POST /trips/{id}/status/ body. Mirrors
        apps.businesses.serializers.KybDecisionSerializer's
        reject-needs-a-reason shape, adapted to "cancelled needs a reason".
        Transition legality (TRIP_TRANSITIONS) is checked here, against
        `self.context["trip"]`'s current status — same context-passing
        convention as apps.network.serializers.RouteStopsUpdateSerializer.
      properties:
        status:
          $ref: '#/components/schemas/Status61dEnum'
        reason:
          type: string
          default: ''
      required:
      - status
    TripVehicle:
      type: object
      properties:
        id:
          type: string
          format: uuid
        registration_number:
          type: string
      required:
      - id
      - registration_number
    Vehicle:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        business:
          type: string
          format: uuid
          readOnly: true
        vehicle_type:
          type: string
          format: uuid
          readOnly: true
        registration_number:
          type: string
          maxLength: 32
        insurance_expires_at:
          type: string
          format: date
          nullable: true
        roadworthiness_expires_at:
          type: string
          format: date
          nullable: true
        is_active:
          type: boolean
        compliance_warnings:
          type: array
          items:
            type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - business
      - compliance_warnings
      - created_at
      - id
      - registration_number
      - vehicle_type
    VehicleCreate:
      type: object
      properties:
        business:
          type: string
          format: uuid
        vehicle_type:
          type: string
          format: uuid
        registration_number:
          type: string
          maxLength: 32
        insurance_expires_at:
          type: string
          format: date
          nullable: true
        roadworthiness_expires_at:
          type: string
          format: date
          nullable: true
      required:
      - business
      - registration_number
      - vehicle_type
    VehicleType:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        business:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 100
        capacity:
          type: integer
          maximum: 2147483647
          minimum: 0
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - business
      - capacity
      - created_at
      - id
      - name
    VehicleTypeCreate:
      type: object
      properties:
        business:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 100
        capacity:
          type: integer
          minimum: 1
      required:
      - business
      - capacity
      - name
    VehicleTypeSeatsGenerate:
      type: object
      description: |-
        Body for POST /vehicle-types/{id}/seats/generate/ —
        docs/specs/8-seat-map-generation.md. `vehicle_type` is passed in
        via context, same as VehicleTypeSeatsUpdateSerializer above.
      properties:
        rows:
          type: integer
          minimum: 1
        columns:
          type: integer
          minimum: 1
        aisle_after_column:
          type: integer
          minimum: 1
          nullable: true
        numbering_scheme:
          allOf:
          - $ref: '#/components/schemas/NumberingSchemeEnum'
          default: row_letter
      required:
      - columns
      - rows
    VehicleTypeSeatsUpdate:
      type: object
      description: |-
        Body: {"seats": [{"seat_number": "1A", "row": 1, "column": 1}, ...]}
        — mirrors apps.network.serializers.RouteStopsUpdateSerializer's
        replace-the-set shape. `vehicle_type` (already resolved by the
        view from the URL) is passed in via context, not a field.
      properties:
        seats:
          type: array
          items:
            $ref: '#/components/schemas/SeatSpec'
      required:
      - seats
    VerticalEnum:
      enum:
      - shuttle
      - intercity
      - metro
      type: string
      description: |-
        * `shuttle` - Shuttle
        * `intercity` - Intercity
        * `metro` - Metro
    Wallet:
      type: object
      properties:
        balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        currency:
          type: string
        transactions:
          type: array
          items:
            $ref: '#/components/schemas/WalletTransaction'
      required:
      - balance
      - currency
      - transactions
    WalletTopupInitiate:
      type: object
      description: |-
        Nested shape for `PaymentInitiateSerializer.wallet_topup` — Phase
        7. `business_id` names the wallet being funded (there's no Booking
        to denormalize it from, unlike the booking-payment shape below).
      properties:
        business_id:
          type: string
          format: uuid
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
      required:
      - amount
      - business_id
    WalletTransaction:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        currency:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount
      - created_at
      - currency
      - id
    WhiteLabelConfig:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        domain:
          type: string
          maxLength: 255
        logo:
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        primary_color:
          type: string
          maxLength: 32
        secondary_color:
          type: string
          maxLength: 32
        email_sender_name:
          type: string
          maxLength: 255
        email_sender_address:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        terms_url:
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
      required:
      - domain
      - id
    WhiteLabelResolve:
      type: object
      properties:
        client_id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        logo:
          type: string
          format: uri
          readOnly: true
        primary_color:
          type: string
          readOnly: true
        secondary_color:
          type: string
          readOnly: true
        email_sender_name:
          type: string
          readOnly: true
        terms_url:
          type: string
          format: uri
          readOnly: true
      required:
      - client_id
      - email_sender_name
      - logo
      - name
      - primary_color
      - secondary_color
      - terms_url
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
