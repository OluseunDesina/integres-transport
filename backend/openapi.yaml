    Me:
      type: object
      description: |-
        `permissions` is additive to the Phase 0 contract (§4) — passengers
        get `["customer:access"]`, platform staff get `["super-admin:access"]`,
        client staff get `["client-admin:access", *role.permissions.codenames]`.
        `role_name`/`client_name` are additive too (NavShell profile menu) —
        both null for passengers and platform staff, since neither has a
        `role` FK, and platform staff have no `client` at all.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        first_name:
          type: string
          readOnly: true
        last_name:
          type: string
          readOnly: true
        client:
          type: string
          format: uuid
          readOnly: true
          nullable: true
          description: NULL for platform staff. Set for tenant-scoped staff and passengers.
        is_platform_staff:
          type: boolean
          readOnly: true
        is_client_staff:
          type: boolean
          readOnly: true
          description: 'Only meaningful when `client` is set: True routes this user
            to the client-admin app, False to the customer (passenger) app. Coarse
            Phase 0 split — full RBAC roles land in Phase 1.'
        permissions:
          type: array
          items:
            type: string
          readOnly: true
        role_name:
          type: string
          nullable: true
          readOnly: true
        client_name:
          type: string
          nullable: true
          readOnly: true
      required:
      - client
      - client_name
      - email
      - first_name
      - id
      - is_client_staff
      - is_platform_staff
      - last_name
      - permissions
      - role_name
