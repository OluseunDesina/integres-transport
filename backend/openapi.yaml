  /api/v1/bookings/:
    get:
      operationId: bookings_list
      description: |-
        GET is staff-only ops visibility (`booking.view`); POST is the
        passenger-facing booking-creation endpoint — `IsAuthenticated` only,
        no Role/Permission gate, since passengers have no Role
        (docs/adr/0003, and see `apps.fares.views.TripFareView`'s own note
        on this same distinction).
      parameters:
      - in: query
        name: business
        schema:
          type: string
        description: Filter to a single Business's bookings. An unknown or another
          Client's Business id returns 400.
      - in: query
        name: date_from
        schema:
          type: string
        description: Inclusive start, as a local date. Omitting both dates lists every
          booking rather than defaulting to a period — a list is bounded by its pagination,
          not by a window nothing on screen mentions.
      - in: query
        name: date_to
        schema:
          type: string
        description: Inclusive end.
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
        description: Case-insensitive substring match on the route name or the passenger's
          email.
      - in: query
        name: status
        schema:
          type: string
        description: Filter to a single status.
      - in: query
        name: trip
        schema:
          type: string
        description: Filter to a single Trip.
      tags:
      - bookings
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBookingList'
          description: ''
    post:
      operationId: bookings_create
      description: |-
        GET is staff-only ops visibility (`booking.view`); POST is the
        passenger-facing booking-creation endpoint — `IsAuthenticated` only,
        no Role/Permission gate, since passengers have no Role
        (docs/adr/0003, and see `apps.fares.views.TripFareView`'s own note
        on this same distinction).
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: Client-generated key. A retried request with the same key and
          body returns the original Booking rather than creating a second one.
        required: true
      tags:
      - bookings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BookingCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BookingCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          description: ''
  /api/v1/bookings/{booking_id}/tickets/:
    get:
      operationId: bookings_tickets_list
      description: |-
        GET /bookings/{booking_id}/tickets/ — the passenger's own
        Tickets for one Booking (normally one, N for a group booking).
        Ownership-mismatch returns 403, matching
        `apps.booking.views.BookingCancelView`'s own precedent; a real but
        not-yet-`paid` Booking returns 404 (no Tickets exist yet), matching
        `PaystackAccountConfigView`'s "distinct 404 for a real-but-not-yet-
        configured state" precedent.
      parameters:
      - in: path
        name: booking_id
        schema:
          type: string
          format: uuid
        required: true
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
      - bookings
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTicketList'
          description: ''
  /api/v1/bookings/{id}/cancel/:
    post:
      operationId: bookings_cancel_create
      description: |-
        POST /bookings/{id}/cancel/ — passenger, own booking only. No
        `booking.manage` codename exists for staff (§2 of the spec): staff
        can see Bookings (`booking.view`), not cancel them on a passenger's
        behalf, this phase.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - bookings
      requestBody:
