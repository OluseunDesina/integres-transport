[project]
name = "integra-afc-backend"
version = "0.1.0"
description = "Integra AFC platform backend (Django/DRF)"
requires-python = ">=3.12"
dependencies = [
    "cbor2>=5.6.0",
    "celery>=5.6.3",
    "django>=6.0.8",
    "django-celery-beat>=2.9.0",
    "django-cors-headers>=4.9.0",
    "djangorestframework>=3.17.2",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular>=0.30.0",
    "psycopg[binary]>=3.3.4",
    "pynacl>=1.5.0",
    "python-decouple>=3.8",
    "redis>=8.1.0",
    "requests>=2.32.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "django-stubs>=6.0.8",
    "djangorestframework-stubs>=3.17.1",
    "factory-boy>=3.3.3",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.13.0",
    "ruff>=0.16.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ", "C4", "SIM"]
ignore = ["DJ001"]

[tool.ruff.lint.isort]
known-first-party = ["config", "apps"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
mypy_path = "."
exclude = ["migrations/"]
strict = false
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "*.migrations.*"
ignore_errors = true

# factory_boy ships no type stubs; DjangoModelFactory's dynamic __call__
# return type cannot be statically resolved to the target model, which
# produces false-positive attribute errors throughout test factories and
# any test that calls them. Test modules are still linted (ruff) and run
# (pytest) — this only relaxes static typing where the ecosystem gap
# makes it noise rather than signal.
[[tool.mypy.overrides]]
module = "*.tests.*"
ignore_errors = true

[tool.django-stubs]
django_settings_module = "config.settings.local"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.ci"
python_files = ["test_*.py", "*_test.py", "tests.py"]
addopts = "--reuse-db"
